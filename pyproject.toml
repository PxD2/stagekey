[project]
name = "stagekey"
version = "0.3.0"
description = "Kid-easy film studio: go-motion, motion-control, optical print, green/blue, hologram, cartoon, Adversal ingest"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
stagekey = "stagekey.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stagekey*"]
