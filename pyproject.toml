[project]
name = "stagekey"
version = "0.1.0"
description = "MCP + CLI for green/blue screen plates, black hologram, and cartoonist looks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
stagekey = "stagekey.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stagekey*"]
